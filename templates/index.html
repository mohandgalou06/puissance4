<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Terminator P4</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #121212; color: #ffffff; margin: 0; padding: 20px;}
        h1 { color: #e94560; text-transform: uppercase; letter-spacing: 2px; }
        
        #menu { background-color: #1f1f2e; padding: 30px; border-radius: 15px; width: 400px; margin: 50px auto; border: 2px solid rgba(233, 69, 96, 0.5); box-shadow: 0 0 20px rgba(233, 69, 96, 0.4), inset 0 0 10px rgba(233, 69, 96, 0.2); }
        .menu-group { margin-bottom: 20px; text-align: left; transition: all 0.3s ease; }
        label { display: block; margin-bottom: 5px; color: #a0a0a0; font-weight: bold; text-align: center; }
        
        select, input[type="range"], input[type="text"] { width: 100%; padding: 10px; background-color: #0d0d16; color: white; border: 1px solid #e94560; border-radius: 5px; text-align: center; text-align-last: center; font-size: 1em; cursor: pointer; box-sizing: border-box; }
        input[type="text"] { cursor: text; text-align-last: auto; }
        input[type="text"]:focus { outline: none; box-shadow: 0 0 10px rgba(233, 69, 96, 0.5); }
        select option { text-align: center; }

        .btn { background-color: #e94560; color: white; border: none; padding: 15px 20px; font-size: 1.1em; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; transition: 0.3s;}
        .btn:hover { background-color: #ff5c77; box-shadow: 0 0 15px #e94560; }
        
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-top: 5px;}
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .file-upload-btn { background-color: #0d0d16; color: #a0a0a0; border: 1px solid #e94560; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box; display: block; text-align: center; font-weight: normal; cursor: pointer;}
        .file-upload-wrapper:hover .file-upload-btn { background-color: #1f1f2e; color: white; }

        #live-controls, #paint-controls { display: none; background-color: #1f1f2e; padding: 15px; border-radius: 10px; width: max-content; margin: 0 auto 20px auto; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center;}
        
        #game-area { display: none; }
        #status { font-size: 1.2em; margin-bottom: 5px; color: #f9a826; font-weight: bold; height: 30px;}
        #ia-msg { font-size: 1.1em; margin-bottom: 15px; color: #00ff88; font-weight: bold; height: 25px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 5px rgba(0,255,136,0.3);}
        
        .board { display: grid; grid-template-columns: repeat(9, 55px); gap: 8px; justify-content: center; background-color: #1f1f2e; padding: 15px 15px 5px 15px; border-radius: 15px; width: max-content; margin: 0 auto; border: 2px solid transparent; transition: 0.4s ease; }
        .board.neon-rouge { border-color: rgba(233, 69, 96, 0.8); box-shadow: 0 0 25px rgba(233, 69, 96, 0.5), inset 0 0 15px rgba(233, 69, 96, 0.3); }
        .board.neon-jaune { border-color: rgba(249, 168, 38, 0.8); box-shadow: 0 0 25px rgba(249, 168, 38, 0.5), inset 0 0 15px rgba(249, 168, 38, 0.3); }
        .board.neon-neutre { border-color: rgba(0, 255, 136, 0.8); box-shadow: 0 0 25px rgba(0, 255, 136, 0.5), inset 0 0 15px rgba(0, 255, 136, 0.3); }
        
        .cell { position: relative; width: 55px; height: 55px; background-color: #0d0d16; border-radius: 50%; cursor: pointer; transition: 0.3s; box-shadow: inset 0 5px 10px rgba(0,0,0,0.8); }
        .cell.rouge { background-color: #e94560; box-shadow: inset 0 -5px 15px rgba(0,0,0,0.4), 0 0 10px rgba(233, 69, 96, 0.6); cursor: default; }
        .cell.jaune { background-color: #f9a826; box-shadow: inset 0 -5px 15px rgba(0,0,0,0.4), 0 0 10px rgba(249, 168, 38, 0.6); cursor: default; }
        .board[data-hover="rouge"] .cell:not(.rouge):not(.jaune):hover { background-color: rgba(233, 69, 96, 0.2); }
        .board[data-hover="jaune"] .cell:not(.rouge):not(.jaune):hover { background-color: rgba(249, 168, 38, 0.2); }
        
        .cell.last-move::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 15px; height: 15px; background-color: rgba(255, 255, 255, 0.9); border-radius: 50%; box-shadow: 0 0 10px white; pointer-events: none; }
        
        /* 🔥 Le néon vert scintillant pour la victoire */
        .cell.winning-cell::before {
            content: ''; position: absolute; inset: -5px; border: 3px solid rgba(0, 255, 136, 0.95);
            border-radius: 50%; box-shadow: 0 0 10px rgba(0, 255, 136, 0.85), 0 0 24px rgba(0, 255, 136, 0.65);
            animation: winning-pulse 1s ease-in-out infinite; pointer-events: none;
        }

        @keyframes winning-pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; box-shadow: 0 0 10px rgba(0, 255, 136, 0.85), 0 0 24px rgba(0, 255, 136, 0.65); }
            50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 16px rgba(0, 255, 136, 1), 0 0 32px rgba(0, 255, 136, 0.9); }
        }
        
        .col-number { width: 55px; height: 25px; line-height: 25px; text-align: center; font-weight: bold; color: #7a7a8c; font-size: 0.9em; cursor: default; }
        #progress-container { width: 400px; background-color: #2a2a35; border-radius: 20px; margin: 0 auto 20px auto; height: 20px; display: none; overflow: hidden;}
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #f9a826, #ffcc70); transition: width 0.3s linear;}
        
        #timers { display: none; justify-content: center; gap: 40px; margin-bottom: 20px; }
        .timer-box { padding: 10px 25px; border-radius: 10px; font-size: 1.5em; font-weight: bold; background: #1f1f2e; border: 2px solid transparent; transition: 0.3s; }
        .timer-red { color: #e94560; }
        .timer-yellow { color: #f9a826; }
        .active-turn { border-color: white; box-shadow: 0 0 20px rgba(255,255,255,0.4); transform: scale(1.05); }
    </style>
</head>
<body>

    <h1>Terminator P4</h1>

    <div id="timers">
        <div id="box-red" class="timer-box timer-red">🔴 <span id="label-red">Rouge</span> <br><span id="time-red">10:00</span></div>
        <div id="box-yellow" class="timer-box timer-yellow">🟡 <span id="label-yellow">Jaune</span> <br><span id="time-yellow">10:00</span></div>
    </div>

    <div id="menu">
        <h2>Configuration du Match</h2>
        <div class="menu-group">
            <label>Mode de Jeu</label>
            <select id="select-mode">
                <option value="pvia">🔴・Joueur VS IA・🟡</option>
            </select>
        </div>
        <div id="ia-settings">
            <div class="menu-group" id="starter-group">
                <label>Qui commence ?</label>
                <select id="select-starter">
                    <option value="human">👤 Vous commencez (Rouges)</option>
                    <option value="ia">🤖 L'IA commence (Rouges)</option>
                </select>
            </div>
        </div>
        
        <button id="btn-start-game" class="btn" onclick="startGame()">NOUVELLE PARTIE</button>
        <button class="btn" style="background-color: #8e44ad; margin-top: 15px;" onclick="enterPaintMode()">🎨 MODE PEINTURE</button>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(233, 69, 96, 0.3);">
            <h3 style="color: #a0a0a0; font-size: 1em; margin-bottom: 15px; text-transform: uppercase;">Benoît TRUONG & Vesagatheepan SIVARAJAH</h3>
            <div class="menu-group">
                <label>1. Séquence texte (ex: 44455)</label>
                <input type="text" id="import-string" placeholder="Saisir les colonnes">
            </div>
            <div class="menu-group">
                <label>2. Ou importer un fichier texte (.txt)</label>
                <div class="file-upload-wrapper">
                    <button class="file-upload-btn" id="file-upload-label">📁 Parcourir un fichier...</button>
                    <input type="file" id="import-file" accept=".txt" onchange="document.getElementById('file-upload-label').innerText = 'Fichier prêt : ' + this.files[0].name">
                </div>
            </div>
            <button class="btn" style="background-color: #f9a826; color:#121212; margin-top: 5px;" onclick="importGame()">IMPORTER ET REPRENDRE</button>
        </div>
    </div>

    <div id="game-area">
        
        <div id="paint-controls" style="display: none; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; background-color: #1f1f2e; padding: 15px; border-radius: 10px; width: max-content; margin-left: auto; margin-right: auto; flex-wrap: wrap;">
            
            <div style="display: flex; gap: 10px; align-items: center;">
                <label style="margin: 0; color: white;">1. Pinceau :</label>
                <select id="paint-color-select" style="width: auto; padding: 5px;" onchange="paintColor = parseInt(this.value)">
                    <option value="1">🔴 Poser Pion Rouge</option>
                    <option value="2">🟡 Poser Pion Jaune</option>
                    <option value="0">⚫ Gomme (Effacer)</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; align-items: center; border-left: 2px solid #555; padding-left: 15px;">
                <label style="margin: 0; color: white;">2. Pour la partie :</label>
                <select id="paint-human-color" style="width: auto; padding: 5px;">
                    <option value="rouge">L'humain est Rouge</option>
                    <option value="jaune">L'humain est Jaune</option>
                </select>
                <select id="paint-next-turn" style="width: auto; padding: 5px;">
                    <option value="rouge">Prochain à jouer : Rouge</option>
                    <option value="jaune">Prochain à jouer : Jaune</option>
                </select>
            </div>

            <div style="width: 100%; display: flex; justify-content: center; gap: 15px; margin-top: 10px;">
                <button class="btn" style="width: auto; background-color: #3498db; padding: 8px 15px;" onclick="analyzeBoard()">🔍 ANALYSER (IA)</button>
                <button class="btn" style="width: auto; background-color: #27ae60; padding: 8px 15px;" onclick="exitPaintMode()">✅ VALIDER LE PLATEAU</button>
                <button class="btn" style="width: auto; background-color: #555; padding: 8px 15px;" onclick="location.reload()">🚪 QUITTER</button>
            </div>
        </div>

        <div id="live-controls">
            <div style="background: #0d0d16; padding: 5px 15px; border-radius: 5px; border: 1px solid #555; display: flex; gap: 10px; align-items: center;">
                <span style="color:#e94560; font-weight:bold;">🔴 Rouge :</span>
                <select id="live-red-type" onchange="onTypeChange()" style="background: #1f1f2e; color: white; border: none; padding: 5px; border-radius: 3px; outline: none; cursor:pointer;">
                    <option value="human">Humain</option>
                    <option value="ia">IA</option>
                </select>
                <span style="color:#f9a826; font-weight:bold; margin-left:10px;">🟡 Jaune :</span>
                <select id="live-yellow-type" onchange="onTypeChange()" style="background: #1f1f2e; color: white; border: none; padding: 5px; border-radius: 3px; outline: none; cursor:pointer;">
                    <option value="human">Humain</option>
                    <option value="ia">IA</option>
                </select>
            </div>

            <button class="btn" style="padding: 10px; width: auto; background-color: #d9534f;" onclick="undoMove()">↩️ Annuler</button>
            <button class="btn" style="padding: 10px; width: auto; background-color: #f9a826; color: black;" onclick="location.reload()">🔄 Recommencer</button>
            <button class="btn" style="padding: 10px; width: auto; background-color: #555; margin-left: auto;" onclick="location.reload()">🚪 Quitter</button>
        </div>

        <div id="status">Préparation de la grille...</div>
        <div id="ia-msg"></div>
        <div id="progress-container"><div id="progress-bar"></div></div>
        
        <div class="board neon-rouge" id="board" data-hover="rouge"></div>
    </div>

    <script>
        const TAB_ID = Math.random().toString(36).substring(2, 15);

        const lignes = 9, colonnes = 9;
        let jeuTermine = false;
        let isAiThinking = false; 
        let currentColorTurn = 'rouge'; 
        let paintMode = false;
        let paintColor = 1;
        let previousGrille = null;
        let customBoardActive = false;
        let winningCells = [];

        let timeRed = 600, timeYellow = 600;
        let timerInterval;
        let aiPollingInterval;

        function setBoardNeon(color) {
            const board = document.getElementById('board');
            board.classList.remove('neon-rouge', 'neon-jaune', 'neon-neutre');
            if(color === 'rouge') board.classList.add('neon-rouge');
            else if(color === 'jaune') board.classList.add('neon-jaune');
            else board.classList.add('neon-neutre');
        }

        function checkNextTurn() {
            if (jeuTermine) return;
            let currentType = (currentColorTurn === 'rouge') ? document.getElementById('live-red-type').value : document.getElementById('live-yellow-type').value;

            if (currentType === 'ia') {
                document.getElementById('status').innerText = "L'IA (" + (currentColorTurn === 'rouge' ? 'Rouge' : 'Jaune') + ") analyse...";
                document.getElementById('board').setAttribute('data-hover', 'none');
                setBoardNeon(currentColorTurn);
                if (!isAiThinking) {
                    setTimeout(() => { declencherIA(); }, 100);
                }
            } else {
                document.getElementById('status').innerText = "À vous de jouer (" + (currentColorTurn === 'rouge' ? 'Rouge' : 'Jaune') + ") !";
                document.getElementById('board').setAttribute('data-hover', currentColorTurn);
                setBoardNeon(currentColorTurn);
                jeuTermine = false;
            }
        }

        function onTypeChange() {
            if (!jeuTermine && !isAiThinking) checkNextTurn();
        }

        function updateTimersDisplay() {
            let rM = Math.floor(timeRed/60), rS = timeRed%60;
            let yM = Math.floor(timeYellow/60), yS = timeYellow%60;
            document.getElementById('time-red').innerText = `${rM}:${rS<10?'0':''}${rS}`;
            document.getElementById('time-yellow').innerText = `${yM}:${yS<10?'0':''}${yS}`;
        }

        function startTimers() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (jeuTermine) return; 
                if (currentColorTurn === 'rouge') timeRed--; else timeYellow--;
                updateTimersDisplay();
                if (timeRed <= 0 || timeYellow <= 0) {
                    clearInterval(timerInterval);
                    alert("Temps écoulé !");
                    jeuTermine = true;
                }
            }, 1000);
        }

        function switchTimer(colorTurn) {
            currentColorTurn = colorTurn;
            document.getElementById('box-red').classList.toggle('active-turn', colorTurn === 'rouge');
            document.getElementById('box-yellow').classList.toggle('active-turn', colorTurn === 'jaune');
        }

        function findLastMove(oldG, newG) {
            if (!oldG || !newG) return null;
            for (let l = 0; l < lignes; l++) {
                for (let c = 0; c < colonnes; c++) {
                    if (oldG[l][c] !== newG[l][c] && newG[l][c] !== 0) return {l, c};
                }
            }
            return null;
        }

        // 🔥 CORRECTION ICI : la variable s'appelle `winning_cells` depuis le serveur Python
        function drawBoard(grille, winCells = []) {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';
            winningCells = Array.isArray(winCells) ? winCells : [];
            const lastMove = findLastMove(previousGrille, grille);
            const winningSet = new Set(winningCells.map(([l, c]) => `${l},${c}`));

            for (let l = 0; l < lignes; l++) {
                for (let c = 0; c < colonnes; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (grille) {
                        if (grille[l][c] === 1) cell.classList.add('rouge');
                        if (grille[l][c] === 2) cell.classList.add('jaune');
                        if (lastMove && lastMove.l === l && lastMove.c === c && !paintMode) cell.classList.add('last-move');
                        if (winningSet.has(`${l},${c}`)) cell.classList.add('winning-cell');
                    }
                    cell.onclick = () => { 
                        if (paintMode && !isAiThinking) paintCell(l, c); 
                        else if (grille[l][c] === 0 && !paintMode) playMove(c); 
                    };
                    boardDiv.appendChild(cell);
                }
            }
            for (let c = 0; c < colonnes; c++) {
                const num = document.createElement('div');
                num.classList.add('col-number');
                num.innerText = c + 1;
                boardDiv.appendChild(num);
            }
            if (grille) previousGrille = JSON.parse(JSON.stringify(grille));
        }

        async function enterPaintMode() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('live-controls').style.display = 'none';
            document.getElementById('timers').style.display = 'none';
            document.getElementById('paint-controls').style.display = 'flex';
            
            document.getElementById('status').innerText = "🖌️ Mode Peinture";
            document.getElementById('ia-msg').innerText = "";
            document.getElementById('board').setAttribute('data-hover', 'none');
            setBoardNeon('neutre');
            
            paintMode = true;
            customBoardActive = true;
            previousGrille = null; 
            await fetch('/reset', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({tab_id: TAB_ID}) }); 
            drawBoard(Array(9).fill().map(()=>Array(9).fill(0)), []); 
        }

        async function paintCell(r, c) {
            const res = await fetch('/paint', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ row: r, col: c, color: paintColor, tab_id: TAB_ID })
            });
            const data = await res.json();
            // 🔥 CORRECTION ICI : data.winning_cells
            drawBoard(data.grille, data.winning_cells || []);
        }

        async function analyzeBoard() {
            if (isAiThinking) return;
            isAiThinking = true;
            document.getElementById('ia-msg').innerText = "";
            document.getElementById('ia-msg').style.color = "#00ff88";
            
            const nextTurnColor = document.getElementById('paint-next-turn').value;
            const colorInt = (nextTurnColor === 'rouge') ? 1 : 2;
            
            startProgressBar();
            
            const res = await fetch('/play', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'analyze', color: colorInt, tab_id: TAB_ID })
            });
            const data = await res.json();
            
            stopProgressBar();
            isAiThinking = false;

            if (data.message_ia) {
                document.getElementById('ia-msg').innerText = data.message_ia;
                if (data.message_ia.includes("MAT EN") || data.message_ia.includes("VICTOIRE")) {
                    document.getElementById('ia-msg').style.color = "#e94560"; 
                }
            }
        }

        function exitPaintMode() {
            paintMode = false;
            document.getElementById('paint-controls').style.display = 'none';
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            document.getElementById('btn-start-game').innerText = "🖌️ JOUER SUR LE PLATEAU PEINT";
            document.getElementById('btn-start-game').style.backgroundColor = "#27ae60";
        }

        async function undoMove() {
            if (jeuTermine) jeuTermine = false;
            if (isAiThinking) return; 

            const res = await fetch('/undo', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({tab_id: TAB_ID})
            });
            const data = await res.json();
            if(data.grille) {
                // 🔥 CORRECTION ICI : data.winning_cells
                drawBoard(data.grille, data.winning_cells || []);
                document.getElementById('ia-msg').innerText = "Coup(s) annulé(s).";
                checkNextTurn(); 
            }
        }

        function startProgressBar() {
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('progress-bar').style.width = '0%';
            let startTime = Date.now();
            
            aiPollingInterval = setInterval(async () => {
                let elapsed = Date.now() - startTime;
                let percent = Math.min((elapsed / 14000) * 100, 100);
                document.getElementById('progress-bar').style.width = percent + '%';
                
                try {
                    let res = await fetch('/status_ia');
                    let data = await res.json();
                    if(data.profondeur > 0 && document.getElementById('ia-msg').innerText === "") {
                        document.getElementById('ia-msg').innerText = "🤖 Profondeur explorée : " + data.profondeur + " ...";
                    }
                } catch(e) {}
            }, 400); 
        }

        function stopProgressBar() {
            clearInterval(aiPollingInterval);
            document.getElementById('progress-bar').style.width = '100%';
            setTimeout(() => { document.getElementById('progress-container').style.display = 'none'; }, 400);
        }

        async function importGame() {
            const fileInput = document.getElementById('import-file');
            let importStr = document.getElementById('import-string').value.trim();
            
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const text = await file.text();
                importStr = text.replace(/\s+/g, '');
            }
            
            if (importStr === "") { startGame(); return; }
            if (!/^[1-9]+$/.test(importStr)) { alert("Format invalide ! Saisissez des chiffres ou importez un fichier .txt."); return; }

            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('live-controls').style.display = 'flex';
            document.getElementById('timers').style.display = 'flex';
            
            timeRed = 600; timeYellow = 600; updateTimersDisplay();
            previousGrille = null;
            
            const starter = document.getElementById('select-starter').value;
            document.getElementById('live-red-type').value = (starter === 'ia') ? 'ia' : 'human';
            document.getElementById('live-yellow-type').value = (starter === 'ia') ? 'human' : 'ia';

            document.getElementById('status').innerText = "Importation...";
            await fetch('/reset', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({tab_id: TAB_ID}) });
            
            let lastData = null; let isWin = false; let validMoves = 0;

            for (let i = 0; i < importStr.length; i++) {
                let col = parseInt(importStr[i]) - 1; 
                const currentImportColor = (i % 2 === 0) ? 1 : 2;
                const res = await fetch('/play', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'human', colonne: col, color: currentImportColor, tab_id: TAB_ID }) });
                lastData = await res.json();
                validMoves++;
                if (lastData.vainqueur) { isWin = true; break; }
            }
            // 🔥 CORRECTION ICI : lastData.winning_cells
            drawBoard(lastData.grille, lastData.winning_cells || []);
            if (isWin) { handleWin(lastData.vainqueur); return; }

            currentColorTurn = (validMoves % 2 === 0) ? 'rouge' : 'jaune';
            jeuTermine = false;

            switchTimer(currentColorTurn);
            startTimers();
            checkNextTurn();
        }

        async function startGame() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('paint-controls').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('live-controls').style.display = 'flex';
            document.getElementById('timers').style.display = 'flex';
            document.getElementById('ia-msg').innerText = "";
            paintMode = false;
            
            timeRed = 600; timeYellow = 600; updateTimersDisplay();
            previousGrille = null; 
            
            if (!customBoardActive) {
                const starter = document.getElementById('select-starter').value;
                document.getElementById('live-red-type').value = (starter === 'ia') ? 'ia' : 'human';
                document.getElementById('live-yellow-type').value = (starter === 'ia') ? 'human' : 'ia';
                currentColorTurn = 'rouge'; 

                await fetch('/reset', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({tab_id: TAB_ID}) });
                drawBoard(Array(9).fill().map(()=>Array(9).fill(0)), []); 
                startTimers();
                switchTimer('rouge'); 
                checkNextTurn();
            } else {
                let p_humanColor = document.getElementById('paint-human-color').value;
                currentColorTurn = document.getElementById('paint-next-turn').value;
                
                document.getElementById('live-red-type').value = (p_humanColor === 'rouge') ? 'human' : 'ia';
                document.getElementById('live-yellow-type').value = (p_humanColor === 'jaune') ? 'human' : 'ia';
                
                const res = await fetch('/play', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'get_grid', tab_id: TAB_ID }) });
                const data = await res.json();
                // 🔥 CORRECTION ICI : data.winning_cells
                drawBoard(data.grille, data.winning_cells || []);
                
                customBoardActive = false; 
                document.getElementById('btn-start-game').innerText = "NOUVELLE PARTIE";
                document.getElementById('btn-start-game').style.backgroundColor = "#e94560";
                
                startTimers();
                switchTimer(currentColorTurn);
                checkNextTurn();
            }
        }

        async function declencherIA() {
            isAiThinking = true;  
            document.getElementById('ia-msg').innerText = ""; 
            startProgressBar(); 
            
            const colorInt = (currentColorTurn === 'rouge') ? 1 : 2;
            
            const res = await fetch('/play', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'ia', color: colorInt, tab_id: TAB_ID }) 
            });
            const iaData = await res.json();
            
            stopProgressBar();
            // 🔥 CORRECTION ICI : iaData.winning_cells
            drawBoard(iaData.grille, iaData.winning_cells || []); 

            if (iaData.message_ia) {
                document.getElementById('ia-msg').innerText = iaData.message_ia;
                if (iaData.message_ia.includes("MAT EN") || iaData.message_ia.includes("VICTOIRE") || iaData.message_ia.includes("défaite")) {
                    document.getElementById('ia-msg').style.color = "#e94560"; 
                } else {
                    document.getElementById('ia-msg').style.color = "#00ff88"; 
                }
            }

            isAiThinking = false; 

            if (iaData.vainqueur) {
                handleWin(iaData.vainqueur);
            } else {
                currentColorTurn = (currentColorTurn === 'rouge') ? 'jaune' : 'rouge';
                switchTimer(currentColorTurn); 
                checkNextTurn(); 
            }
        }

        function handleWin(vainqueur) {
            document.getElementById('status').innerText = vainqueur === "Nul" ? "Match Nul !" : "👑 Victoire de " + vainqueur;
            document.getElementById('status').style.color = vainqueur === "Nul" ? "#ffcc00" : "#00ff88";
            document.getElementById('board').setAttribute('data-hover', 'none'); 
            setBoardNeon('neutre');
            jeuTermine = true;
            clearInterval(timerInterval);
        }

        async function playMove(c) {
            let currentType = (currentColorTurn === 'rouge') ? document.getElementById('live-red-type').value : document.getElementById('live-yellow-type').value;
            if (jeuTermine || currentType === 'ia' || isAiThinking || paintMode) return;
            
            document.getElementById('ia-msg').innerText = ""; 
            const colorInt = (currentColorTurn === 'rouge') ? 1 : 2;
            
            const res = await fetch('/play', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'human', colonne: c, color: colorInt, tab_id: TAB_ID }) 
            });
            const humanData = await res.json();
            
            // 🔥 CORRECTION ICI : humanData.winning_cells
            drawBoard(humanData.grille, humanData.winning_cells || []); 

            if (humanData.vainqueur) { 
                handleWin(humanData.vainqueur); 
                return; 
            }

            currentColorTurn = (currentColorTurn === 'rouge') ? 'jaune' : 'rouge';
            switchTimer(currentColorTurn); 
            checkNextTurn(); 
        }
    </script>
</body>
</html>
